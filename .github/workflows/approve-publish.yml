name: Approve & Publish Video

# Manual trigger only. Run this from the Actions tab (web or GitHub mobile
# app) whenever Telegram tells you a video is ready. Paste in the video_id
# from the Telegram message and tap "Run workflow".
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID to publish (from the Telegram message)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish video
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_STATE_TOKEN }}
          GITHUB_REPO: ${{ secrets.GH_STATE_REPO }}
          GITHUB_BRANCH: ${{ secrets.GH_STATE_BRANCH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/approve_publish.py "${{ inputs.video_id }}"
